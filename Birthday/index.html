<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Unnati 💗</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-floaters" aria-hidden="true"></div>

<div class="page-wrap">

  <h1 class="site-title">a tiny corner of the internet( don't forget to tap the music button)</h1>
  <p class="site-subtitle">Made for MY UMIII</p>

  <div class="cat-stage">
    <div class="cat-scene">
      <!-- ================================
           CUTE CARTOON CAT HOLDING BOARD
           (pure SVG, no external image needed)
           ================================ -->
      <svg class="cat-svg" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <!-- tail -->
        <path d="M235 220 C 275 210, 285 160, 260 140" stroke="#f4c9a8" stroke-width="18" fill="none" stroke-linecap="round"/>

        <!-- body -->
        <ellipse cx="160" cy="235" rx="72" ry="55" fill="#fbdcc0"/>

        <!-- paws holding board -->
        <ellipse cx="108" cy="222" rx="16" ry="13" fill="#fbdcc0" stroke="#f4c9a8" stroke-width="2"/>
        <ellipse cx="212" cy="222" rx="16" ry="13" fill="#fbdcc0" stroke="#f4c9a8" stroke-width="2"/>

        <!-- head -->
        <circle cx="160" cy="140" r="62" fill="#fce3ca"/>

        <!-- board (in front of head, visible and easy to tap) -->
        <g id="birthday-board" tabindex="0" role="button" aria-label="Click the birthday board">
          <rect x="70" y="168" width="180" height="70" rx="10" fill="#fffdf9" stroke="#f3b8c6" stroke-width="4" transform="rotate(-2 160 203)"/>
          <text x="160" y="196" text-anchor="middle" font-family="Caveat, cursive" font-size="20" fill="#c93f57" transform="rotate(-2 160 203)">Happy Birthday</text>
          <text x="160" y="222" text-anchor="middle" font-family="Caveat, cursive" font-size="24" font-weight="700" fill="#c93f57" transform="rotate(-2 160 203)">Unnati 💗</text>
        </g>

        <!-- ears -->
        <path d="M110 105 L95 55 L145 90 Z" fill="#fce3ca"/>
        <path d="M210 105 L225 55 L175 90 Z" fill="#fce3ca"/>
        <path d="M112 98 L102 70 L132 88 Z" fill="#f6b8c6"/>
        <path d="M208 98 L218 70 L188 88 Z" fill="#f6b8c6"/>

        <!-- birthday hat -->
        <polygon points="160,45 140,95 180,95" fill="#e2586f"/>
        <circle cx="160" cy="42" r="7" fill="#ffd9b8"/>
        <rect x="138" y="90" width="44" height="8" rx="4" fill="#f3b8c6"/>

        <!-- blush -->
        <ellipse cx="128" cy="152" rx="12" ry="8" fill="#f6a7bb" opacity="0.7"/>
        <ellipse cx="192" cy="152" rx="12" ry="8" fill="#f6a7bb" opacity="0.7"/>

        <!-- eyes -->
        <ellipse cx="140" cy="135" rx="6" ry="8" fill="#5b4b4f"/>
        <ellipse cx="180" cy="135" rx="6" ry="8" fill="#5b4b4f"/>
        <circle cx="142" cy="132" r="2" fill="#fff"/>
        <circle cx="182" cy="132" r="2" fill="#fff"/>

        <!-- nose + mouth -->
        <path d="M155 148 L165 148 L160 154 Z" fill="#e2586f"/>
        <path d="M160 154 Q160 160 150 160" stroke="#5b4b4f" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M160 154 Q160 160 170 160" stroke="#5b4b4f" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- whiskers -->
        <line x1="95" y1="140" x2="125" y2="138" stroke="#c9a98f" stroke-width="1.5"/>
        <line x1="95" y1="150" x2="125" y2="150" stroke="#c9a98f" stroke-width="1.5"/>
        <line x1="225" y1="140" x2="195" y2="138" stroke="#c9a98f" stroke-width="1.5"/>
        <line x1="225" y1="150" x2="195" y2="150" stroke="#c9a98f" stroke-width="1.5"/>

        <!-- sparkles around -->
        <text x="55" y="90" font-size="18">✨</text>
        <text x="255" y="100" font-size="16">💗</text>
        <text x="245" y="200" font-size="16">⭐</text>
        <text x="45" y="200" font-size="16">💫</text>
      </svg>
    </div>

    <p class="board-hint">(tap the board 🎀)</p>

    <div id="reveal-message" class="reveal-message">
      Someone very close to my heart was born today... YOU!!!!!, and I'm really lucky You exist. 💗
    </div>
  </div>

  <p class="hand-note">HEYYYYYYYAAAA UMIII... I made you something special. 🎀</p>

  <div class="nav-forward">
    <a href="memories.html" class="cute-btn">Click Me →</a>
  </div>

</div>

<button id="music-btn" class="music-toggle">♫ Play Music</button>
<audio id="bg-audio" loop>
  <source src="audio/birthday-song.mp3.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
